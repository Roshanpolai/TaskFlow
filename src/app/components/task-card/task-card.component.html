<div
  class="task-card"
  cdkDrag
  [cdkDragData]="task"
  (click)="onCardClick()"
  role="button"
  tabindex="0"
  [attr.aria-label]="'Task: ' + task.title"
  (keydown.enter)="onCardClick()"
  (keydown.space)="onCardClick(); $event.preventDefault()"
>
  <!-- Card Header: Priority badge & Action buttons -->
  <div class="card-header">
    <span class="priority-badge" [ngClass]="'priority-' + task.priority">
      <span class="priority-dot"></span>
      <span class="priority-label">{{ task.priority | uppercase }}</span>
    </span>

    <div class="card-actions">
      <button
        type="button"
        class="action-btn edit-btn"
        (click)="onEditClick($event)"
        title="Edit task details"
        aria-label="Edit task"
      >
        <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14">
          <path d="M5.433 13.917l1.262-3.155A4 4 0 017.58 9.42l6.92-6.918a2.121 2.121 0 013 3l-6.92 6.918c-.383.383-.84.685-1.343.886l-3.154 1.262a.5.5 0 01-.65-.65z" />
          <path d="M3.5 5.75c0-.69.56-1.25 1.25-1.25H10A.75.75 0 0010 3H4.75A2.75 2.75 0 002 5.75v9.5A2.75 2.75 0 004.75 18h9.5A2.75 2.75 0 0017 15.25V10a.75.75 0 00-1.5 0v5.25c0 .69-.56 1.25-1.25 1.25h-9.5c-.69 0-1.25-.56-1.25-1.25v-9.5z" />
        </svg>
      </button>

      <button
        type="button"
        class="action-btn delete-btn"
        (click)="onDeleteClick($event)"
        title="Delete task"
        aria-label="Delete task"
      >
        <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14">
          <path fill-rule="evenodd" d="M8.75 1A2.75 2.75 0 006 3.75v.443c-.795.077-1.584.176-2.365.298a.75.75 0 10.23 1.482l.149-.022.841 10.518A2.75 2.75 0 007.596 19h4.807a2.75 2.75 0 002.742-2.53l.841-10.52.149.023a.75.75 0 00.23-1.482A41.03 41.03 0 0014 4.193V3.75A2.75 2.75 0 0011.25 1h-2.5zM10 4c.84 0 1.673.025 2.5.075V3.75c0-.69-.56-1.25-1.25-1.25h-2.5c-.69 0-1.25.56-1.25 1.25v.325C8.327 4.025 9.16 4 10 4zM8.58 7.72a.75.75 0 00-1.5.06l.3 7.5a.75.75 0 101.5-.06l-.3-7.5zm4.34.06a.75.75 0 10-1.5-.06l-.3 7.5a.75.75 0 101.5.06l.3-7.5z" clip-rule="evenodd" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Card Body: Title & Description -->
  <h4 class="card-title" [class.completed-title]="task.status === 'done'">{{ task.title }}</h4>

  @if (task.description) {
    <p class="card-desc">{{ task.description }}</p>
  }

  <!-- Card Footer: Due Date badge & Assignee -->
  <div class="card-footer">
    <div class="due-badge" [class.overdue]="isOverdue" [class.due-today]="isDueToday" [class.due-done]="task.status === 'done'">
      @if (task.status === 'done') {
        <svg viewBox="0 0 20 20" fill="currentColor" width="13" height="13">
          <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
        </svg>
        <span>Done</span>
      } @else if (isOverdue) {
        <svg viewBox="0 0 20 20" fill="currentColor" width="13" height="13">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm.75-13a.75.75 0 00-1.5 0v5c0 .414.336.75.75.75h4a.75.75 0 000-1.5h-3.25V5z" clip-rule="evenodd" />
        </svg>
        <span>Overdue ({{ formattedDueDate }})</span>
      } @else if (isDueToday) {
        <svg viewBox="0 0 20 20" fill="currentColor" width="13" height="13">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm.75-13a.75.75 0 00-1.5 0v5c0 .414.336.75.75.75h4a.75.75 0 000-1.5h-3.25V5z" clip-rule="evenodd" />
        </svg>
        <span>Today</span>
      } @else {
        <svg viewBox="0 0 20 20" fill="currentColor" width="13" height="13">
          <path fill-rule="evenodd" d="M5.75 2a.75.75 0 01.75.75V4h7V2.75a.75.75 0 011.5 0V4h.25A2.75 2.75 0 0118 6.75v8.5A2.75 2.75 0 0115.25 18H4.75A2.75 2.75 0 012 15.25v-8.5A2.75 2.75 0 014.75 4H5V2.75A.75.75 0 015.75 2zm-1 5.5c-.69 0-1.25.56-1.25 1.25v6.5c0 .69.56 1.25 1.25 1.25h10.5c.69 0 1.25-.56 1.25-1.25v-6.5c0-.69-.56-1.25-1.25-1.25H4.75z" clip-rule="evenodd" />
        </svg>
        <span>{{ formattedDueDate }}</span>
      }
    </div>

    <!-- Assignee avatar -->
    <div
      class="assignee-avatar"
      [style.background-color]="task.assignee.avatarBg"
      [title]="task.assignee.name + ' (' + task.assignee.role + ')'"
    >
      {{ task.assignee.initials }}
    </div>
  </div>
</div>
