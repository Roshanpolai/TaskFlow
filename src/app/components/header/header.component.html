<header class="header">
  <div class="header-left">
    <!-- Hamburger button for mobile/tablet -->
    <button
      type="button"
      class="hamburger-btn"
      (click)="onHamburgerClick()"
      aria-label="Toggle navigation drawer"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <!-- Search Input -->
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
        <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd" />
      </svg>
      <input
        type="text"
        class="search-input"
        placeholder="Search tasks by title or details..."
        [ngModel]="taskService.filter().search"
        (ngModelChange)="onSearchChange($event)"
        aria-label="Search tasks"
      />
      @if (taskService.filter().search) {
        <button
          type="button"
          class="search-clear-btn"
          (click)="clearSearch()"
          aria-label="Clear search query"
        >
          <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14">
            <path d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z" />
          </svg>
        </button>
      }
    </div>
  </div>

  <!-- Filters Row -->
  <div class="header-filters">
    <!-- Priority Filter -->
    <div class="filter-group">
      <label for="filter-priority" class="sr-only">Priority Filter</label>
      <select
        id="filter-priority"
        class="filter-select"
        [value]="taskService.filter().priority"
        (change)="onPriorityChange($event)"
      >
        <option value="all">All Priorities</option>
        <option value="high">High Priority</option>
        <option value="medium">Medium Priority</option>
        <option value="low">Low Priority</option>
      </select>
    </div>

    <!-- Assignee Filter -->
    <div class="filter-group">
      <label for="filter-assignee" class="sr-only">Assignee Filter</label>
      <select
        id="filter-assignee"
        class="filter-select"
        [value]="taskService.filter().assigneeId"
        (change)="onAssigneeChange($event)"
      >
        <option value="all">All Assignees</option>
        @for (person of taskService.assignees(); track person.id) {
          <option [value]="person.id">{{ person.name }}</option>
        }
      </select>
    </div>

    <!-- Clear Filters Pill -->
    @if (taskService.isFilterActive()) {
      <button
        type="button"
        class="clear-filters-btn"
        (click)="onClearAllFilters()"
        title="Clear all active filters"
      >
        <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14">
          <path d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z" />
        </svg>
        <span>Clear Filters</span>
      </button>
    }
  </div>

  <!-- Right Actions: Theme Toggle & Add Task -->
  <div class="header-right">
    <!-- Theme Toggle -->
    <button
      type="button"
      class="theme-toggle-btn"
      (click)="onToggleTheme()"
      [title]="themeService.isDarkMode() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
      [attr.aria-label]="themeService.isDarkMode() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
    >
      @if (themeService.isDarkMode()) {
        <!-- Sun Icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
          <circle cx="12" cy="12" r="5" />
          <line x1="12" y1="1" x2="12" y2="3" />
          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
      } @else {
        <!-- Moon Icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      }
    </button>

    <!-- Add Task Button -->
    <button
      type="button"
      class="add-task-btn"
      (click)="onAddTask()"
      title="Create a new task"
    >
      <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
        <path d="M10.75 4.75a.75.75 0 00-1.5 0v4.5h-4.5a.75.75 0 000 1.5h4.5v4.5a.75.75 0 001.5 0v-4.5h4.5a.75.75 0 000-1.5h-4.5v-4.5z" />
      </svg>
      <span class="btn-text">Add Task</span>
    </button>
  </div>
</header>
