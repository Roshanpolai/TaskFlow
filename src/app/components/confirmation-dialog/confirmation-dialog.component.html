@if (isOpen) {
  <div class="dialog-backdrop" (click)="onBackdropClick($event)" role="presentation">
    <div class="dialog-card" role="dialog" aria-modal="true" [attr.aria-label]="title">
      <div class="dialog-header">
        <div class="dialog-icon-wrapper" [class.danger]="isDanger">
          @if (isDanger) {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22">
              <circle cx="12" cy="12" r="10" />
              <line x1="12" y1="16" x2="12" y2="12" />
              <line x1="12" y1="8" x2="12.01" y2="8" />
            </svg>
          }
        </div>
        <div class="dialog-title-block">
          <h3 class="dialog-title">{{ title }}</h3>
          <p class="dialog-message">{{ message }}</p>
        </div>
      </div>

      <div class="dialog-footer">
        <button
          type="button"
          class="btn btn-secondary"
          (click)="onCancel()"
        >
          {{ cancelText }}
        </button>
        <button
          type="button"
          class="btn"
          [class.btn-danger]="isDanger"
          [class.btn-primary]="!isDanger"
          (click)="onConfirm()"
        >
          {{ confirmText }}
        </button>
      </div>
    </div>
  </div>
}
